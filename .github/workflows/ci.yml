name: CI

# The package declares macOS 15 and iOS 18 and needs Swift 6.2 or later (tools-version 6.2). The macos-26 image with
# Xcode 26.6 is pinned below, like the apps; bump it on purpose. The test job runs the tests on every pull request; post-merge runs
# the consumer check (a separate package on the public API, and the README's quick start) and an iOS Simulator build.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like the apps: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  changes:
    # A pull request or a merge to main that changes only prose (top-level *.md, docs/, LICENSE, issue templates) takes no macOS runner: `test`
    # is then skipped, which a required check counts as passed (suite#170). Anything else, a Release PR's manifest included, runs.
    name: Build inputs changed
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -vE '^([^/]+\.md|docs/.*|LICENSE|\.github/ISSUE_TEMPLATE/.*)$' changed.txt | grep -q .; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    # On the pull request, on the push to main after the merge (so main cannot go red unnoticed), on a tag and by hand;
    # skipped when a pull request or a merge changes only prose (`changes`, suite#170).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The org's Mac runners while MACEM_MAC_RUNNER is set (never for a fork PR): either one while MACEM_KIT_RUNNER is set
    # too (EMSuite tools/ci-runner/README.md), else the first; else GitHub's macos-26.
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.MACEM_MAC_RUNNER && (vars.MACEM_KIT_RUNNER && fromJSON(vars.MACEM_KIT_RUNNER) || fromJSON(vars.MACEM_MAC_RUNNER)) || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      # Metal suites skip themselves with a named reason when MTLCreateSystemDefaultDevice() is nil (hosted runners
      # may have no GPU); the CPU float64 reference tests always run.
      - name: Test
        run: swift test -c release

  post-merge:
    name: Consumer checks and iOS build (after merge)
    # Not on pull requests: the free plan's macOS runners are scarce, so the extra builds run on main, tags and by hand.
    if: github.event_name != 'pull_request'
    # GitHub's runner, always: it has the iOS Simulator platform installed, which the Mac runner's user does not
    # (the iOS step failed there). The job runs after the merge and blocks nothing, so the queue does not matter.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Consumer check (a separate package, the public API only; then the README's quick start)
        run: tools/consumer-check/run.sh
      - name: Build the libraries for iOS
        run: xcodebuild -scheme SimulatoDetector -destination 'generic/platform=iOS Simulator' -quiet build

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
